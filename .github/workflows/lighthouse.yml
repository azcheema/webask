name: Lighthouse (full)

# ON-DEMAND ONLY — deliberately NOT `push: [main]`. This is not a coverage cut.
#
# `.lighthouserc.cjs` is a single shared config, so `pnpm lhci` here and
# `pnpm lhci` in ci.yml were byte-identical: the same 8 URLs, the same
# numberOfRuns: 3, the same assertMatrix. ci.yml already runs on `push: [main]`,
# so every merge audited the same commit twice — 335s inside CI and 333s again
# here, 97 min/30d for a second opinion that could not differ from the first.
# The merge commit is still fully audited, by ci.yml, in the same push event.
#
# Kept as workflow_dispatch because an on-demand audit costs nothing until
# someone clicks it, and is useful for checking a perf change without a push.
# If you ever make this run automatically again, first make it audit something
# ci.yml does not — otherwise you are just buying the same number twice.
on:
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lighthouse:
    name: full lighthouse on representative URLs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      # Must match ci.yml. NEXT_PUBLIC_* is inlined at build time, so without
      # this the consent banner does not render and this workflow audits a
      # materially different page from the one ci.yml audits — two Lighthouse
      # runs against the same commit, disagreeing for a reason nobody would spot.
      NEXT_PUBLIC_GA_ID: "G-TEST0000000"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # URL list lives in .lighthouserc.cjs (shared with the PR `ci.yml` run).
      # Phase 1 covers the 6 indexable critical templates; add the programmatic
      # template (Phase 2) and a sample blog post (Phase 3) there as they ship.
      - name: Lighthouse CI (full)
        run: pnpm lhci

      # See the same step in ci.yml: `.lighthouseci` is dot-prefixed, so
      # upload-artifact's default `include-hidden-files: false` silently matched
      # nothing and no report was ever uploaded.
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-full-${{ github.run_id }}
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
