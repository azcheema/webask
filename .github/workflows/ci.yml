name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # manual runs, e.g. to verify the build cache after a config change

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · build · e2e · lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      # Fake GA4 ID so the build renders the consent banner (NEXT_PUBLIC_* is
      # inlined at build time). Lets Playwright + axe exercise the banner and
      # keeps Lighthouse validating its a11y/perf. No real property — and the
      # GA/Clarity scripts only load *after* consent, which CI never grants, so
      # no external requests fire. Production uses Vercel's real env value.
      NEXT_PUBLIC_GA_ID: "G-TEST0000000"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # MUST stay above `Build` — and above `Install`. Two separate reasons,
      # both of which make a correctly-placed cache step look misplaced, so it
      # gets "tidied" back down next to the build it serves. Do not move it.
      #
      # 1. actions/cache RESTORES at its own step position and only SAVES in
      #    the post-job hook. Below `Build` the restore lands after the build
      #    has already run: run 31361902907 logged `Cache not found` at
      #    06:26:56, 28s AFTER `Compiled successfully` at 06:26:28 — then
      #    dutifully saved at 06:35:59. Every build ran cold while faithfully
      #    writing a cache nothing ever read.
      # 2. hashFiles globs the workspace at the moment it is evaluated. Below
      #    `Install`, `**/*.ts` walks the whole dependency tree to compute a
      #    key meant to describe source — 14s of the old placement's cost.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Token contrast audit
        run: pnpm check:contrast

      - name: Keyword audit
        run: pnpm check:keywords

      - name: Programmatic uniqueness audit
        run: pnpm check:uniqueness

      # Covers content/{blog,services,industries,locations}. The fork source is
      # not present on CI, so this runs the cross-page half only. The cross-site
      # half (vs. the fork's pages, same-slug and max-against-any) is a local
      # check — see the note in the script.
      - name: MDX uniqueness audit
        run: pnpm check:content-uniqueness

      # Pre-build so a redirect loop fails in milliseconds, not after a full
      # build + e2e cycle. e2e/redirects.spec.ts proves the same map over HTTP.
      - name: Redirect map audit
        run: pnpm check:redirects

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Lighthouse CI
        run: pnpm lhci

      # `.lighthouseci` is a DOT-prefixed directory, and upload-artifact treats
      # dotted paths as hidden — with the default `include-hidden-files: false`
      # it matched nothing and logged "No files were found", silently, on every
      # run. Combined with `if-no-files-found: ignore` that meant a failing
      # Lighthouse assertion left no report to inspect: the a11y gate could fail
      # without anyone being able to see which audit failed. Both are fixed here.
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results-${{ github.run_id }}
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
